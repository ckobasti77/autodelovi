<!doctype html>
<html lang="sr-Latn-RS">
<head>
<meta charset="utf-8">
<title>SKLOP — OG frame proof (step 03)</title>
<!-- Proof of the OG image frame (DESIGN-SYSTEM §2.3), rendered to og-frame.png at 1200×630.
     Step 19 rebuilds it with next/og ImageResponse using assets/fonts/og/*.woff + @fontsource WOFFs. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600&family=Martian+Mono:wght@400&display=block">
<style>
  @font-face { font-family: "Archivo Expanded"; font-weight: 700; src: url("../../../app/fonts/archivo-expanded-700.woff2") format("woff2"); }
  @font-face { font-family: "Archivo Expanded"; font-weight: 600; src: url("../../../app/fonts/archivo-expanded-600.woff2") format("woff2"); }
  html, body { margin: 0; }
  .og { position: relative; width: 1200px; height: 630px; overflow: hidden; background: #0D0F11; color: #F1ECE3; font-family: "Public Sans", sans-serif; }
  .frame { position: absolute; inset: 32px; border: 1px solid #2C3238; }
  .tick { position: absolute; width: 14px; height: 14px; border: 0 solid #434A52; }
  .tl { top: 26px; left: 26px; border-top-width: 1px; border-left-width: 1px; }
  .tr { top: 26px; right: 26px; border-top-width: 1px; border-right-width: 1px; }
  .bl { bottom: 26px; left: 26px; border-bottom-width: 1px; border-left-width: 1px; }
  .br { bottom: 26px; right: 26px; border-bottom-width: 1px; border-right-width: 1px; }
  .brand { position: absolute; top: 72px; left: 72px; display: flex; align-items: center; gap: 14px; font: 700 28px/1 "Archivo Expanded", sans-serif; letter-spacing: 0.08em; }
  .brand svg { width: 30px; height: 30px; color: #F1ECE3; }
  .copy { position: absolute; left: 72px; top: 160px; width: 580px; display: flex; flex-direction: column; gap: 18px; }
  .title { margin: 0 0 6px; font: 700 52px/1 "Archivo Expanded", sans-serif; text-transform: uppercase; letter-spacing: 0.005em; }
  .meta { font: 400 22px/1.4 "Martian Mono", monospace; color: #969088; letter-spacing: 0.01em; }
  .meta b { font-weight: 400; color: #C4BEB4; }
  .count { font: 600 22px/1.4 "Public Sans", sans-serif; color: #C4BEB4; }
  .render { position: absolute; right: 72px; top: 64px; width: 440px; height: 440px; background: radial-gradient(60% 60% at 50% 45%, #1A1E23 0%, #121518 60%, #0D0F11 100%); border: 1px solid #1E2227; }
  .render svg { position: absolute; inset: 40px; width: 360px; height: 360px; }
  .ruler { position: absolute; left: 72px; right: 72px; bottom: 72px; height: 24px; border-top: 1px solid #434A52;
           background: repeating-linear-gradient(90deg, #2C3238 0 1px, transparent 1px 12px); background-size: 100% 8px; background-repeat: no-repeat; }
  .tag { position: absolute; left: 72px; bottom: 44px; font: 400 16px/1 "Martian Mono", monospace; color: #969088; letter-spacing: 0.04em; }
  .tagline { position: absolute; right: 72px; bottom: 44px; font: 600 16px/1 "Public Sans", sans-serif; color: #C4BEB4; }
</style>
</head>
<body>
<div class="og">
  <div class="frame"></div>
  <span class="tick tl"></span><span class="tick tr"></span><span class="tick bl"></span><span class="tick br"></span>
  <div class="brand">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2.5" width="10" height="5" rx="0.75" fill="#FF6B1A"/><path d="M12 8.5v4.5" stroke="currentColor" stroke-width="1.25" stroke-dasharray="1.3 1.1"/><path d="M3 14h4v2.5h10V14h4v7H3z" fill="currentColor"/></svg>
    SKLOP
  </div>
  <div class="copy">
    <h1 class="title">Kočioni diskovi za VW Golf VII</h1>
    <div class="meta">OEM <b>5Q0 615 301 F</b> · Brembo</div>
    <div class="count">48 artikala na stanju</div>
  </div>
  <div class="render">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <circle cx="100" cy="100" r="88" fill="#2b3138" stroke="#969088"/>
      <circle cx="100" cy="100" r="78" fill="none" stroke="#9FE9FF" stroke-opacity="0.35"/>
      <circle cx="100" cy="100" r="40" fill="#1c2025" stroke="#6e767f"/>
      <circle cx="100" cy="100" r="15" fill="#101215" stroke="#6e767f"/>
      <g stroke="#434a52"><line x1="100" y1="22" x2="100" y2="52"/><line x1="100" y1="148" x2="100" y2="178"/><line x1="22" y1="100" x2="52" y2="100"/><line x1="148" y1="100" x2="178" y2="100"/></g>
    </svg>
  </div>
  <div class="ruler"></div>
  <div class="tag">Primer · demo</div>
  <div class="tagline">Rasklopi auto. Nađi deo.</div>
</div>
</body>
</html>
